<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef2f2" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#ef4444" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10b981" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="440" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title Banner -->
  <text x="430" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f172a">MySQL 并发控制对比：传统行锁 vs MVCC 多版本并发</text>
  <text x="430" y="68" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">彻底摆脱“读写互斥”枷锁，实现“写不阻塞读、读不阻塞写”的高性能飞跃</text>

  <!-- LEFT CARD: Traditional Lock -->
  <g transform="translate(35, 95)" filter="url(#shadow)">
    <rect width="375" height="315" rx="12" fill="url(#cardGrad1)" stroke="#fecaca" stroke-width="1.5"/>
    
    <!-- Header Badge -->
    <rect x="20" y="16" width="160" height="28" rx="6" fill="#fee2e2"/>
    <text x="100" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">❌ 传统机制：读写互斥</text>

    <!-- Sub description -->
    <text x="20" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">依赖 S 锁与 X 锁互斥，读写操作彼此强行排队</text>

    <!-- Visual Box: Shared Data -->
    <rect x="40" y="85" width="295" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="187" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">聚簇索引数据行 (Record)</text>
    <text x="187" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#dc2626">当前被事务 T2 加持 X 锁 (排他锁)</text>

    <!-- Transactions Interaction -->
    <!-- T1 (Reader) -->
    <rect x="40" y="175" width="135" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="107" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">读事务 T1</text>
    <text x="107" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">请求读操作 (S 锁)</text>

    <!-- Conflict Arrow -->
    <path d="M 107 175 L 107 155" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
    <rect x="75" y="152" width="64" height="18" rx="4" fill="#fee2e2"/>
    <text x="107" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626">阻塞等待 ⏳</text>

    <!-- T2 (Writer) -->
    <rect x="200" y="175" width="135" height="48" rx="8" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
    <text x="267" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#991b1b">写事务 T2</text>
    <text x="267" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">正在修改并持有 X 锁</text>

    <!-- Consequence Footer Box -->
    <rect x="20" y="242" width="335" height="55" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
    <text x="35" y="263" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9f1239">⚠️ 核心缺陷：</text>
    <text x="35" y="283" font-family="system-ui, sans-serif" font-size="11.5" fill="#881337">写事务未提交前，读操作必须阻塞挂起；吞吐极低，极易锁超时。</text>
  </g>

  <!-- RIGHT CARD: MVCC -->
  <g transform="translate(450, 95)" filter="url(#shadow)">
    <rect width="375" height="315" rx="12" fill="url(#cardGrad2)" stroke="#bbf7d0" stroke-width="1.5"/>

    <!-- Header Badge -->
    <rect x="20" y="16" width="190" height="28" rx="6" fill="#dcfce7"/>
    <text x="115" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d">✅ MVCC 机制：读写并发</text>

    <!-- Sub description -->
    <text x="20" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">写操作生成版本链，快照读查询 Undo 历史版本，互不干扰</text>

    <!-- Visual Box: Current Record & Undo Log -->
    <rect x="200" y="85" width="155" height="60" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="277" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">当前记录 (最新态)</text>
    <text x="277" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#dc2626">写事务 T2 独占修改</text>

    <!-- Undo Log History Version -->
    <rect x="20" y="85" width="155" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="97" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">Undo Log (历史快照)</text>
    <text x="97" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#15803d">旧版本：数据稳定可见</text>

    <!-- Roll Pointer link -->
    <path d="M 200 115 L 180 115" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="190" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0284c7">回滚指针</text>

    <!-- Transactions Interaction -->
    <!-- T1 (Reader) -->
    <rect x="20" y="175" width="155" height="48" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
    <text x="97" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">读事务 T1 (快照读)</text>
    <text x="97" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#15803d">读取 Undo 快照，无需加锁</text>

    <!-- Non-blocking Arrow -->
    <path d="M 97 175 L 97 151" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="68" y="152" width="58" height="18" rx="4" fill="#dcfce7"/>
    <text x="97" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d">即时返回 ⚡</text>

    <!-- T2 (Writer) -->
    <rect x="200" y="175" width="155" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="277" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">写事务 T2</text>
    <text x="277" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">写最新数据，并追加 Undo</text>
    <path d="M 277 175 L 277 151" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>

    <!-- MVCC Advantage Footer Box -->
    <rect x="20" y="242" width="335" height="55" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="35" y="263" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#14532d">🚀 核心价值：</text>
    <text x="35" y="283" font-family="system-ui, sans-serif" font-size="11.5" fill="#166534">读操作零等待！高并发读写下性能无损，完美支撑高负载互联网业务。</text>
  </g>
</svg>
