<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="timeArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="470" rx="16" fill="url(#bgGrad4)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="38" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f172a">RC (读已提交) vs RR (可重复读) 的 ReadView 生成时机对比</text>
  <text x="440" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">隔离级别差异的根本原因：究竟是“每次 SELECT 新建视图”，还是“首次 SELECT 全局复用”</text>

  <!-- LEFT: RC Card -->
  <g transform="translate(40, 85)" filter="url(#shadow4)">
    <rect width="385" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="385" height="42" rx="12" fill="#f8fafc"/>
    <rect x="15" y="10" width="180" height="22" rx="4" fill="#fee2e2"/>
    <text x="105" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">RC：每次 SELECT 都生成新视图</text>

    <!-- Timeline Axis -->
    <line x1="45" y1="65" x2="45" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#timeArrow)"/>
    <text x="45" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">时间推进 ➔</text>

    <!-- Step 1 -->
    <circle cx="45" cy="80" r="5" fill="#3b82f6"/>
    <rect x="65" y="65" width="295" height="42" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="75" y="82" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1">第一次 SELECT 查询</text>
    <text x="75" y="98" font-family="system-ui, sans-serif" font-size="10.5" fill="#0284c7">生成 ReadView 1 ➔ 查到数据为 "张三" (V1)</text>

    <!-- Step 2: Tx B modifies and commits -->
    <circle cx="45" cy="140" r="5" fill="#f59e0b"/>
    <rect x="65" y="125" width="295" height="42" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="75" y="142" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">并发事务 B 执行更新并 COMMIT</text>
    <text x="75" y="158" font-family="system-ui, sans-serif" font-size="10.5" fill="#78350f">数据修改为 "李四" (V2) 且事务 B 已关闭</text>

    <!-- Step 3: Tx A selects again -->
    <circle cx="45" cy="200" r="5" fill="#ef4444"/>
    <rect x="65" y="185" width="295" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="75" y="202" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">第二次 SELECT 查询</text>
    <text x="75" y="217" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">再次新建 ReadView 2！</text>
    <text x="75" y="228" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">此时事务 B 已提交，查到 "李四" (V2)</text>

    <!-- Bottom Result -->
    <rect x="20" y="255" width="345" height="42" rx="6" fill="#fee2e2"/>
    <text x="192" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">⚠️ 现象：前后两次读取结果不一致</text>
    <text x="192" y="289" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#991b1b">（出现了“不可重复读”，符合 RC 隔离级别定义）</text>
  </g>

  <!-- RIGHT: RR Card -->
  <g transform="translate(455, 85)" filter="url(#shadow4)">
    <rect width="385" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="385" height="42" rx="12" fill="#f8fafc"/>
    <rect x="15" y="10" width="200" height="22" rx="4" fill="#dcfce7"/>
    <text x="115" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">RR：仅首次 SELECT 生成，全程复用</text>

    <!-- Timeline Axis -->
    <line x1="45" y1="65" x2="45" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#timeArrow)"/>
    <text x="45" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">时间推进 ➔</text>

    <!-- Step 1 -->
    <circle cx="45" cy="80" r="5" fill="#3b82f6"/>
    <rect x="65" y="65" width="295" height="42" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="75" y="82" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1">第一次 SELECT 查询</text>
    <text x="75" y="98" font-family="system-ui, sans-serif" font-size="10.5" fill="#0284c7">生成 ReadView 1 ➔ 查到数据为 "张三" (V1)</text>

    <!-- Step 2: Tx B modifies and commits -->
    <circle cx="45" cy="140" r="5" fill="#f59e0b"/>
    <rect x="65" y="125" width="295" height="42" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="75" y="142" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">并发事务 B 执行更新并 COMMIT</text>
    <text x="75" y="158" font-family="system-ui, sans-serif" font-size="10.5" fill="#78350f">数据修改为 "李四" (V2) 且事务 B 已关闭</text>

    <!-- Step 3: Tx A selects again in RR -->
    <circle cx="45" cy="200" r="5" fill="#10b981"/>
    <rect x="65" y="185" width="295" height="48" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="75" y="202" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">第二次 SELECT 查询</text>
    <text x="75" y="217" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#166534">继续复用最初的 ReadView 1！</text>
    <text x="75" y="228" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">事务 B 视为未来或活跃事务，仍读取 "张三" (V1)</text>

    <!-- Bottom Result -->
    <rect x="20" y="255" width="345" height="42" rx="6" fill="#dcfce7"/>
    <text x="192" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">✅ 现象：前后两次读取完全一致</text>
    <text x="192" y="289" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#166534">（成功避免不可重复读，实现真正的“可重复读”）</text>
  </g>
</svg>
