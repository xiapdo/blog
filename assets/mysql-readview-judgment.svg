<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="540" rx="16" fill="url(#bgGrad3)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="38" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f172a">ReadView 事务可见性判定算法与数轴全景</text>
  <text x="460" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">快照读执行时抓取瞬间全局快照，根据版本 DB_TRX_ID 所处数轴区间仲裁可见性</text>

  <!-- 4 Core Parameters Card -->
  <g transform="translate(40, 85)" filter="url(#shadow3)">
    <rect width="840" height="85" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">📋 ReadView 内部封装的 4 大核心参数：</text>

    <g transform="translate(20, 35)">
      <!-- creator_trx_id -->
      <rect x="0" y="0" width="185" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="12" y="16" font-family="system-ui, monospace" font-size="11" font-weight="700" fill="#0284c7">creator_trx_id</text>
      <text x="12" y="30" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">创建该视图的事务 ID</text>

      <!-- m_ids -->
      <rect x="200" y="0" width="205" height="38" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
      <text x="212" y="16" font-family="system-ui, monospace" font-size="11" font-weight="700" fill="#b45309">m_ids: [100, 102]</text>
      <text x="212" y="30" font-family="system-ui, sans-serif" font-size="10.5" fill="#78350f">瞬间所有活跃(未提交)事务ID</text>

      <!-- min_trx_id -->
      <rect x="420" y="0" width="195" height="38" rx="6" fill="#dcfce7" stroke="#4ade80"/>
      <text x="432" y="16" font-family="system-ui, monospace" font-size="11" font-weight="700" fill="#15803d">min_trx_id: 100</text>
      <text x="432" y="30" font-family="system-ui, sans-serif" font-size="10.5" fill="#166534">m_ids 中最小值(最早未提交)</text>

      <!-- max_trx_id -->
      <rect x="630" y="0" width="190" height="38" rx="6" fill="#fee2e2" stroke="#f87171"/>
      <text x="642" y="16" font-family="system-ui, monospace" font-size="11" font-weight="700" fill="#b91c1c">max_trx_id: 105</text>
      <text x="642" y="30" font-family="system-ui, sans-serif" font-size="10.5" fill="#991b1b">预分配的下一个事务 ID</text>
    </g>
  </g>

  <!-- Middle: Axis Visualization -->
  <g transform="translate(40, 195)">
    <!-- Axis Line -->
    <line x1="20" y1="90" x2="820" y2="90" stroke="#475569" stroke-width="3" marker-end="url(#axisArrow)"/>
    <text x="825" y="95" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">事务 ID 增长方向 ➔</text>

    <!-- Boundary Tick: min_trx_id -->
    <line x1="260" y1="50" x2="260" y2="130" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="4,3"/>
    <rect x="200" y="20" width="120" height="24" rx="4" fill="#0284c7"/>
    <text x="260" y="36" text-anchor="middle" font-family="system-ui, monospace" font-size="11" font-weight="700" fill="#ffffff">min_trx_id (100)</text>

    <!-- Boundary Tick: max_trx_id -->
    <line x1="600" y1="50" x2="600" y2="130" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <rect x="540" y="20" width="120" height="24" rx="4" fill="#dc2626"/>
    <text x="600" y="36" text-anchor="middle" font-family="system-ui, monospace" font-size="11" font-weight="700" fill="#ffffff">max_trx_id (105)</text>

    <!-- Zone 1: < min_trx_id (Green) -->
    <rect x="20" y="105" width="235" height="135" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="137" y="130" text-anchor="middle" font-family="system-ui, monospace" font-size="13" font-weight="700" fill="#15803d">trx_id &lt; min_trx_id</text>
    <rect x="72" y="142" width="130" height="24" rx="12" fill="#dcfce7"/>
    <text x="137" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">✅ 数据完全可见</text>
    <text x="137" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">在生成 ReadView 之前</text>
    <text x="137" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">该事务早已提交，安全可见</text>

    <!-- Zone 2: [min_trx_id, max_trx_id) (Yellow/Orange) -->
    <rect x="265" y="105" width="330" height="135" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="430" y="128" text-anchor="middle" font-family="system-ui, monospace" font-size="12" font-weight="700" fill="#b45309">min_trx_id ≤ trx_id &lt; max_trx_id</text>
    
    <!-- Sub branch A: in m_ids -->
    <rect x="280" y="140" width="140" height="88" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="350" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">若 trx_id ∈ m_ids</text>
    <text x="350" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">❌ 不可见</text>
    <text x="350" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">活跃未提交事务</text>
    <text x="350" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">顺版本链向前找</text>

    <!-- Sub branch B: not in m_ids -->
    <rect x="440" y="140" width="140" height="88" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="510" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d">若 trx_id ∉ m_ids</text>
    <text x="510" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">✅ 可见</text>
    <text x="510" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">虽比 min 晚开启</text>
    <text x="510" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">但快照前已提交</text>

    <!-- Zone 3: >= max_trx_id (Red) -->
    <rect x="605" y="105" width="235" height="135" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
    <text x="722" y="130" text-anchor="middle" font-family="system-ui, monospace" font-size="13" font-weight="700" fill="#b91c1c">trx_id ≥ max_trx_id</text>
    <rect x="657" y="142" width="130" height="24" rx="12" fill="#fee2e2"/>
    <text x="722" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">❌ 绝对不可见</text>
    <text x="722" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">在生成 ReadView 之后</text>
    <text x="722" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">才开启的“未来事务”，不可见</text>
  </g>

  <!-- Bottom Special Privilege Note -->
  <g transform="translate(40, 460)">
    <rect width="840" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">🌟 特权例外规则（自身修改）：</text>
    <text x="20" y="44" font-family="system-ui, sans-serif" font-size="11.5" fill="#1e40af">如果被访问版本的 DB_TRX_ID == creator_trx_id，说明这条记录就是当前事务自己修改的，始终无条件【直接可见】！</text>
  </g>
</svg>
